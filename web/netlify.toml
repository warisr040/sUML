# sUML — static site, no build step.
#   /           front page (index.html)
#   /app.html   the diagram editor
#   /manual.html, /design.html   documentation
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # connect-src 'none' blocks every network request from the pages: diagrams can never be uploaded.
    # Fonts and images are embedded or served from this site only.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Short link: /app opens the editor.
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200
