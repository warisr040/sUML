# sUML — static site, no build step.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # connect-src 'none' blocks every network request from the page: diagrams can never be uploaded.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
