<style>

  --font:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;

*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.45 var(--font);color:var(--text);background:var(--canvas);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100vh}
.glass{background:var(--chrome);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px}
header{position:absolute;z-index:4;top:12px;left:12px;right:12px;height:54px;display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
.brand{font-weight:700;display:flex;align-items:center;gap:9px;margin-right:6px;white-space:nowrap;font-size:14.5px;letter-spacing:-.01em}
.logo{width:32px;height:32px;display:grid;place-items:center;filter:drop-shadow(0 3px 8px rgba(10,23,54,.35))}
#title{border:1px solid transparent;border-radius:8px;padding:6px 9px;font:inherit;font-weight:600;width:160px;min-width:110px;color:var(--text);background:none}
#title:hover{background:var(--hover)}#title:focus{border-color:var(--accent-line);background:var(--field);outline:none}
.tb{display:flex;align-items:center;gap:2px;padding-left:8px;margin-left:4px;border-left:1px solid var(--line);height:28px}
button.b{border:1px solid transparent;background:none;border-radius:8px;padding:6px 9px;font:inherit;font-weight:500;color:var(--text);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;line-height:1.2;transition:background .12s,color .12s,border-color .12s}
button.b:hover{background:var(--hover)}
button.b.on{background:var(--accent-soft);color:var(--accent)}
button.b.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 2px 10px rgba(79,70,229,.35)}
button.b.primary:hover{filter:brightness(1.08)}
button.b svg{width:16px;height:16px;flex:none}
button.b:disabled{opacity:.35;cursor:default}
#zoomLbl{min-width:54px;justify-content:center;font-variant-numeric:tabular-nums}
select.b{max-width:132px;border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;font:inherit;background:var(--field);color:var(--text);cursor:pointer}
.spacer{flex:1;min-width:8px}
aside#palette{position:absolute;z-index:3;top:116px;left:12px;bottom:46px;width:236px;overflow:auto;padding:4px 10px 18px;scrollbar-width:thin}
aside#props{position:absolute;z-index:3;top:116px;right:12px;bottom:46px;width:272px;overflow:auto;padding:14px 16px 24px;scrollbar-width:thin}
[hidden]{display:none!important}
#tabbar{position:absolute;z-index:4;top:74px;left:12px;right:12px;height:36px;display:flex;align-items:center;gap:3px;padding:0 6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;border-radius:11px}
#tabbar::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;max-width:220px;height:27px;padding:0 5px 0 11px;border-radius:8px;border:1px solid transparent;background:none;color:var(--text);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;flex:none}
.tab .tt{overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--chrome-solid);border-color:var(--line-2);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.tab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;opacity:.5;font-size:14px;line-height:1}
.tab .x:hover{background:var(--hover);opacity:1}
.tab.add{padding:0 10px;font-size:16px;font-weight:500}
.tabcount{margin-left:auto;font-size:11px;color:var(--muted);padding:0 6px;white-space:nowrap}
.foldhead{display:flex;align-items:center;justify-content:space-between;padding:6px 0 2px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.foldbtn{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;width:26px;height:24px;font-size:15px;line-height:1}
.foldbtn:hover{background:var(--hover);color:var(--text)}
.foldtab{display:none}
aside.folded{width:40px!important;padding:0!important;overflow:hidden!important}
aside.folded>.foldhead,aside.folded>#paletteBody,aside.folded>#propsBody{display:none}
aside.folded>.foldtab{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;writing-mode:vertical-rl;cursor:pointer}
aside.folded>.foldtab:hover{color:var(--accent);background:var(--hover)}
#layersPanel{position:absolute;z-index:3;top:116px;right:296px;width:340px;max-height:calc(100% - 170px);overflow:auto;padding:10px 12px 14px}
body.fold-right #layersPanel{right:64px}
#layersPanel .lcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#layersPanel .lcol h4{margin:0 0 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
#layersPanel .lcol+.lcol{border-left:1px solid var(--line);padding-left:10px}
#layersPanel .lcol .lrow{padding:6px 7px;flex-wrap:wrap;gap:2px}
.lrow{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid transparent;background:none;color:var(--text);font:inherit;padding:7px 9px;border-radius:8px;cursor:pointer;text-align:left}
.lrow:hover{background:var(--hover)}
.lrow.on{background:var(--accent-soft);border-color:var(--accent-line)}
.lrow small{color:var(--muted)}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.phead b{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pnote{font-size:11.5px;color:var(--muted);margin:0 0 8px}
#smartWin{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:50px;width:560px;max-width:calc(100% - 620px);min-width:360px;max-height:40vh;overflow:auto;padding:10px 12px}
.sm-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sm-head>b{font-size:12.5px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-dir{display:flex;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
.sm-dir button.b{padding:3px 8px;border-color:var(--line-2)}
.sm-row{display:grid;grid-template-columns:18px minmax(60px,1fr) 104px 104px 28px 28px;gap:6px;align-items:center;padding:4px 6px;border-radius:8px;font-size:12px}
.sm-row:hover{background:var(--hover)}
.sm-row select{border:1px solid var(--line-2);border-radius:6px;padding:3px 4px;font:inherit;font-size:11.5px;background:var(--field);color:var(--text)}
.sm-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-row button{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;height:24px}
.sm-row button:hover{background:var(--hover);color:var(--text)}
.sm-cols{display:grid;grid-template-columns:18px minmax(60px,1fr) 104px 104px 28px 28px;gap:6px;padding:0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#helpWin{position:absolute;z-index:8;top:74px;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 24px));max-height:calc(100% - 130px);overflow:auto;padding:14px 18px 18px}
#helpWin .help p{margin:0 0 9px}
.helpbrand{display:flex;align-items:center;gap:14px;padding:6px 0 14px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.helpbrand b{display:block;font-size:20px;letter-spacing:-.01em}.helpbrand span{display:block;color:var(--muted);font-size:13px}.helpbrand small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
#emptyMark{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;opacity:.55;color:var(--muted);text-align:center}
#emptyMark b{font-size:22px;color:var(--text);opacity:.8}#emptyMark span{font-size:13px}
#ctxMenu{position:fixed;z-index:50;padding:4px;min-width:200px;border-radius:10px}
#ctxMenu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);font:inherit;padding:7px 10px;border-radius:7px;cursor:pointer}
#ctxMenu button:hover{background:var(--accent-soft);color:var(--accent)}
aside#palette{user-select:none;-webkit-user-select:none}
details.sec>summary[draggable=true]{cursor:grab}
details.sec.dragging{opacity:.4}
details.sec.dropbefore{box-shadow:inset 0 2px 0 var(--accent)}
details.sec.dropafter{box-shadow:inset 0 -2px 0 var(--accent)}
#smartOpt{position:absolute;z-index:7;padding:12px 14px;width:300px}
#viewPop{position:absolute;z-index:7;padding:10px 12px 12px;width:250px;display:flex;flex-direction:column;gap:4px}
#viewPop .phead{margin-bottom:2px}
#viewPop>.b{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;height:auto;padding:8px 10px;border-radius:10px}
#viewPop>.b svg{width:18px;height:18px}
#viewPop>.b .lbl{display:inline!important}
#viewPop>.b small{grid-column:2/-1;color:var(--muted);font-size:11px;font-weight:400;margin-top:-2px}
#viewPop>.b .st{font-size:10.5px;font-weight:700;color:var(--muted)}
#viewPop>.b.on .st{color:var(--accent)}
#viewPop>.b .st.tg::before{content:'OFF'}
#viewPop>.b.on .st.tg::before{content:'ON'}
#bView{position:relative}
#bView .vdot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);display:none}
body.smart-on #bView .vdot{display:block}
#snipBar{position:absolute;z-index:6;bottom:52px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;font-size:12px;color:var(--muted);white-space:nowrap}
#stage.snipping, #stage.snipping *{cursor:crosshair!important}
#snipCard{position:absolute;z-index:8;right:18px;bottom:56px;width:300px;padding:10px 12px 12px;font-size:12.5px}
#snipCard img{display:block;width:100%;max-height:180px;object-fit:contain;border-radius:8px;border:1px solid var(--line-2);background:var(--field);margin:6px 0 8px;cursor:zoom-in}
#snipCard .btns{display:flex;flex-wrap:wrap;gap:6px}
#snipCard .ok{color:#059669;font-weight:600}
#setPop{position:absolute;z-index:7;padding:12px 14px;width:320px;max-height:calc(100vh - 90px);overflow:auto}
#setPop .ph2{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}
#setPop input[type=range]{width:100%;accent-color:var(--accent)}
#setPop .orow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line)}
#setPop .orow label{display:flex;align-items:center;gap:8px;font-weight:600}
#setPop .val{font:600 12px "JetBrains Mono",ui-monospace,monospace;color:var(--accent)}
#smartOpt .orow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}
#smartOpt .orow label{display:flex;align-items:center;gap:8px;font-weight:600}
#smartOpt input[type=range]{width:100%;accent-color:var(--accent)}
#smartOpt .val{font:600 12px "JetBrains Mono",ui-monospace,monospace;color:var(--accent);min-width:56px;text-align:right}
#penBar{position:absolute;z-index:5;bottom:52px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;font-size:12px;color:var(--muted)}
#penBar .swb{width:20px;height:20px}#penBar .swb.on{outline:2px solid var(--accent);outline-offset:2px}
#penBar .wbtn{border:1px solid var(--line-2);background:var(--field);border-radius:8px;width:30px;height:26px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
#penBar .wbtn.on{border-color:var(--accent);background:var(--accent-soft)}
#cmtBar{position:absolute;z-index:5;bottom:52px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;color:var(--muted);white-space:nowrap}
#cmtBar .b.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
#cmtBar .swb{width:18px;height:18px}#cmtBar .swb.on{outline:2px solid var(--accent);outline-offset:2px}
#comments .cmt{pointer-events:none}

.btns button.b.danger{color:var(--danger)}
.help p{margin:0 0 11px;color:var(--text);opacity:.9}
.help kbd{font:11px "JetBrains Mono",ui-monospace,Consolas,monospace;background:var(--hover);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 4px}
.help table{border-collapse:collapse;width:100%;font-size:12px}
.help td{padding:4px 0;vertical-align:top;border-top:1px solid var(--line)}.help td:first-child{white-space:nowrap;padding-right:8px}
.note{background:rgba(16,185,129,.09);border:1px solid rgba(16,185,129,.3);color:var(--text);border-radius:10px;padding:9px 11px;font-size:12px}
footer{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:10px;display:flex;align-items:center;gap:12px;padding:5px 14px;font-size:11.5px;color:var(--muted);white-space:nowrap;border-radius:999px;max-width:calc(100% - 24px);overflow:hidden}
footer .ok{color:var(--ok)}
.inline-editor{position:absolute;z-index:5;resize:none;border:2px solid #4f46e5;border-radius:8px;padding:4px 6px;font-family:var(--font);background:rgba(255,255,255,.98);box-shadow:0 8px 24px rgba(15,23,42,.18);outline:none;line-height:1.25;color:#0f172a}
#toast{position:fixed;bottom:52px;left:50%;transform:translateX(-50%) translateY(16px);background:#0f172a;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.barup #toast{bottom:104px}
#bView .lbl,#bPen .lbl,#bPath .lbl{display:none}
@media (max-width:1500px){#bNew .lbl,#bOpen .lbl{display:none}}
@media (max-width:1400px){#bSaveAs .lbl,#bSnip .lbl,#bPen .lbl,#bPath .lbl{display:none}}
@media (max-width:1180px){#title{width:84px;min-width:70px}select.b{max-width:96px}.tb{padding-left:5px;margin-left:2px}header .b{padding-left:7px;padding-right:7px}}
@media (max-width:1340px){#title{width:120px;min-width:90px}.brand>span:last-child{display:none}select.b{max-width:112px}}
@media (max-width:1560px){#bCmt .lbl,#bSmart .lbl,#bAlign .lbl,#bLayers .lbl,#bKbd .lbl{display:none}.brand small{display:none}}
@media (max-width:1240px){.b .lbl{display:none}}
@media (max-width:820px){aside#props{display:none}#stInfo,#stHint{display:none}}
@media (max-width:560px){aside#palette{width:170px}}

<script>
(() => {
'use strict';
const APP_VERSION = '1.5';

/* ================= basics ================= */
const FONT = 'Segoe UI, Roboto, Helvetica, Arial, sans-serif';
const GRID = 10, ACC = '#4f46e5', INK = '#1f2430';
const STORE_KEY = 'suml.doc.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1 = v => Math.round(v * 10) / 10;
const rid = p => p + Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const isHex = v => /^#[0-9a-f]{6}$/i.test(v || '');
const DOT = GRID * 2; // the visible grid dots are DOT apart (see applyView); Snap puts things on them
const snapV = v => Math.round(v / DOT) * DOT;

const mctx = document.createElement('canvas').getContext('2d');
function textW(t, fs, bold) { mctx.font = (bold ? 'bold ' : '') + fs + 'px ' + FONT; return mctx.measureText(t).width; }
function wrap(text, maxW, fs, bold) {
  const out = [];
  for (const para of String(text ?? '').split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      const t = line ? line + ' ' + w : w;
      if (line && textW(t, fs, bold) > maxW) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function textSvg(lines, x, y, o) {
  if (!lines.length || (lines.length === 1 && !lines[0])) return '';
  const fs = o.fs || 13, lh = fs * 1.25, y0 = y - (lines.length - 1) * lh / 2;
  let s = `<text x="${f1(x)}" y="${f1(y0)}" font-size="${fs}" fill="${o.color || INK}" text-anchor="${o.anchor || 'middle'}" dominant-baseline="central"${o.bold ? ' font-weight="bold"' : ''}${o.italic ? ' font-style="italic"' : ''}${o.transform ? ` transform="${o.transform}"` : ''}>`;
  lines.forEach((l, i) => { s += `<tspan x="${f1(x)}"${i ? ` dy="${f1(lh)}"` : ''}>${esc(l) || '\u00a0'}</tspan>`; });
  return s + '</text>';
}
const TX = (n, b, o = {}) => {
  if (!n.text) return '';
  const lines = wrap(n.text, b.w - 10, n.fs, o.bold), H = lines.length * n.fs * 1.25, pad = 6;
  const x = n.ha === 'l' ? b.x + pad : n.ha === 'r' ? b.x + b.w - pad : b.x + b.w / 2;
  const y = n.va === 't' ? b.y + 4 + H / 2 : n.va === 'b' ? b.y + b.h - 4 - H / 2 : b.y + b.h / 2;
  return textSvg(lines, x, y, { fs: n.fs, color: n.color, bold: o.bold, anchor: n.ha === 'l' ? 'start' : n.ha === 'r' ? 'end' : 'middle' });
};
const PIC_RE = /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/;
const TXT_ALIGN_OK = t => SH[t] && !SH[t].noText && /\bTX\(/.test(String(SH[t].render));
const dashA = v => v === 'dot' ? ' stroke-dasharray="0.1 3.6" stroke-linecap="round"' : v ? ' stroke-dasharray="6 4"' : '';
const dashE = (v, w = 1.5) => { const k = Math.max(1, w / 1.5); return v === 'dot' ? ` stroke-dasharray="0.1 ${f1(4 * k)}" stroke-linecap="round"` : v ? ` stroke-dasharray="${f1(7 * k)} ${f1(5 * k)}"` : ''; };
const P = n => `fill="${n.fill}" stroke="${n.stroke}" stroke-width="1.5"${dashA(n.dash)}`;
const polyR = n => `<polygon points="${SH[n.type].poly(n).map(q => f1(q[0]) + ',' + f1(q[1])).join(' ')}" ${P(n)}/>`;

/* ================= smart: auto-connect loose line ends touched by a moved box ================= */
function autoConnectAfterMove(ids, origE) {
  if (!ui.smart) return;
  const tol = Math.max(4, 8 / view.k);
  const boxes = doc.nodes.filter(n => ids.has(n.id) && n.w > 0 && n.h > 0 && !SH[n.type].container);
  if (!boxes.length) return;
  let k = 0;
  for (const e of doc.edges) {
    if (origE && origE.has(e.id)) continue; // lines being dragged along are left alone
    for (const [end, pk, other] of [['from', 'p1', 'to'], ['to', 'p2', 'from']]) {
      const q = !e[end] && e[pk]; if (!q) continue;
      for (const n of boxes) {
        if (e[other] === n.id) continue;
        const inX = q.x >= n.x - tol && q.x <= n.x + n.w + tol, inY = q.y >= n.y - tol && q.y <= n.y + n.h + tol;
        if (!inX || !inY) continue;
        const dB = Math.min(Math.abs(q.x - n.x), Math.abs(q.x - n.x - n.w), Math.abs(q.y - n.y), Math.abs(q.y - n.y - n.h));
        if (dB > tol) continue; // must touch the border, not sit deep inside
        const pt = projectToBox(n, q);
        setEnd(e, end, n.id, { side: 'pt', at: { u: +((pt.x - n.x) / n.w).toFixed(4), v: +((pt.y - n.y) / n.h).toFixed(4) } });
        lineLayer(e); k++; break;
      }
    }
  }
  if (k) { renderScene(); toast(`Smart: connected ${k} loose line end${k > 1 ? 's' : ''}`); }
}

  const a = byId[e.from] || doc.nodes.find(n => n.id === e.from), b = byId[e.to] || doc.nodes.find(n => n.id === e.to);

function autoLayerAfterMove(ids, added) {
  if (!ui.smart || !ui.autoLayer) return;
  const step = Math.max(1, Math.min(100, Math.round(+ui.autoLayerStep || 1)));
  const moved = doc.nodes.filter(n => ids.has(n.id) && !SH[n.type].container && n.w > 0);
  const others = doc.nodes.filter(n => !ids.has(n.id) && n.w > 0);
  const msgs = [];
  for (const n of moved) {
    const before = L(n);
    // moved away from the object it was raised above → go back down
    if (n.autoInc) {
      const base = L(n) - n.autoInc;
      if (!others.some(o => L(o) === base && overlaps(n, o))) { n.layer = Math.max(0, base); delete n.autoInc; }

}

  if (!HAS_HOST) { try { localStorage.setItem(CFG_KEY, t); } catch (_) {} return; }
  clearTimeout(cfgT); cfgPending = true;
  cfgT = setTimeout(flushConfig, 300);
}
let cfgPending = false;
async function flushConfig() {
  clearTimeout(cfgT); if (!cfgPending) return; cfgPending = false;
  try { const r = await window.sumlSaveConfig(JSON.stringify(config, null, 2)); if (r) toast('Could not save settings: ' + r); } catch (_) { toast('Could not save settings'); }
}
const presetFromKey = k => k && k.startsWith('act:') ? (ACTIONS[k.slice(4)] ? { action: k.slice(4), label: ACTIONS[k.slice(4)].label } : null) : k === 'free-arrow' ? { free: true, label: 'Free arrow' } : k && k.startsWith('fav:') ? (config.favs && config.favs[+k.slice(4)] ? clone(config.favs[+k.slice(4)]) : null) : PRESETS[k] ? clone(PRESETS[k]) : null;
function renderFavs() {
  const g = $('#favGrid'); if (!g) return; g.innerHTML = '';
  const fs = config.favs || [];
  if (!fs.length) { g.append(el('p', { class: 'pnote', style: 'grid-column:1/-1;margin:2px 4px 6px' }, 'Right-click any shape below → Add to Favorites.')); return; }
  fs.forEach((p, i) => {
    const key = 'fav:' + i;
    const it = el('button', { class: 'pi', type: 'button', draggable: 'true', 'data-key': key, title: 'Click to add, drag onto the canvas · right-click to remove', html: slotIcon(p) + `<span>${esc(p.label || '')}</span>` });
    it.addEventListener('click', () => addNode(clone(p)));
    it.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/plain', key); ev.dataTransfer.effectAllowed = 'copy'; });
    g.append(it);
  });
}
function showCtx(x, y, items) {
  const m = $('#ctxMenu'); m.innerHTML = ''; m.hidden = false;
  for (const it of items) { if (it === '-') { m.append(el('hr')); continue; } if (it instanceof Node) { m.append(it); continue; } const [lab, fn] = it; const b = el('button', { type: 'button', onclick: () => { if (!fn) return; m.hidden = true; fn(); } }, lab); if (!fn) b.disabled = true; m.append(b); }
  m.style.left = Math.min(x, innerWidth - 220) + 'px'; m.style.top = Math.max(8, Math.min(y, innerHeight - m.offsetHeight - 8)) + 'px';
}
window.addEventListener('pointerdown', ev => { const m = $('#ctxMenu'); if (m && !m.hidden && !m.contains(ev.target)) m.hidden = true; }, true);
const samePreset = (a, b) => !!a && !!b && (a.grp || b.grp ? JSON.stringify(a.grp) === JSON.stringify(b.grp) : a.action || b.action ? a.action === b.action : a.free ? !!b.free : a.type === b.type && JSON.stringify(a.props || {}) === JSON.stringify(b.props || {}));
function slotIcon(p) {
  if (p.grp) { const ns = p.grp.nodes, W = Math.max(1, ...ns.map(n => n.x + n.w)), H = Math.max(1, ...ns.map(n => n.y + n.h)), k = Math.min(44 / W, 28 / H);
    return `<svg viewBox="0 0 48 32"><g transform="translate(${f1((48 - W * k) / 2)} ${f1((32 - H * k) / 2)}) scale(${k})">${ns.map(n => `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${3 / k}" fill="${isHex(n.fill) ? n.fill : 'none'}" stroke="currentColor" stroke-width="${1.3 / k}"/>`).join('')}</g></svg>`; }
  if (p.action) return ACTIONS[p.action] ? ACTIONS[p.action].icon : '';
  if (p.free) return `<svg viewBox="0 0 48 32"><path d="M8,24 L33,12" stroke="currentColor" stroke-width="1.5"/><path d="M42,8 L31,9 L35,17 Z" fill="currentColor"/></svg>`;
  return SH[p.type] ? iconSvg(p.type, p.props) : '';
}
function toggleKbd(force) {
  const m = $('#kbdMenu'); m.hidden = force === undefined ? !m.hidden : !force;
  $('#bKbd').classList.toggle('on', !m.hidden); renderKbd();
}
function renderKbd() {
  const m = $('#kbdMenu'); if (m.hidden) return; m.innerHTML = '';
  m.append(el('div', { class: 'phead' }, el('b', {}, 'Shortcut menu'), el('button', { class: 'foldbtn', title: 'Close (Esc)', onclick: () => toggleKbd(false) }, '×')));
  m.append(el('p', { class: 'pnote' }, 'Drag a shape from the Shapes panel, or an action below, onto a slot. Press the keys to add that shape or run that action (with Smart on, it is placed next to the selected box and connected). ' +
    (HAS_HOST ? 'Saved in sUML.config.json next to sUML.exe.' : 'Saved in this browser.') + (HAS_HOST ? '' : ' Note: browsers keep Ctrl+W / Ctrl+T for themselves — those two work in the desktop app.')));
  m.append(el('div', { class: 'ph' }, 'Actions · drag onto a slot'));
  const ag = el('div', { class: 'sgrid acts' });
  for (const [k, a] of Object.entries(ACTIONS)) {
    const it = el('div', { class: 'slot filled act', draggable: 'true', title: `Drag “${a.label}” onto a Ctrl or Alt slot` }, el('span', { html: a.icon }), el('span', {}, a.label));
    it.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/plain', 'act:' + k); ev.dataTransfer.effectAllowed = 'copy'; });
    ag.append(it);
  }
  m.append(ag);
  for (const [kind, lab] of [['ctrl', 'Ctrl'], ['alt', 'Alt']]) {
    m.append(el('div', { class: 'ph' }, lab + ' + 1 … 0, Q … T'));
    const g = el('div', { class: 'sgrid' });
    for (const code of SLOT_CODES) {
      const p = config.shortcuts[kind][code];
      const d = el('div', { class: 'slot' + (p ? ' filled' : ''), title: p ? `${lab}+${codeLabel(code)}: ${p.label} — click to add, × to clear` : 'Drag a shape here' }, el('span', { class: 'k' }, `${lab}+${codeLabel(code)}`));
      if (p) {
        d.append(el('span', { html: slotIcon(p) }), el('span', {}, p.label || ''));
        d.append(el('button', { class: 'sx', type: 'button', title: 'Clear', onclick: ev => { ev.stopPropagation(); delete config.shortcuts[kind][code]; saveConfig(); renderKbd(); renderBadges(); } }, '×'));
        d.addEventListener('click', () => useSlot(p));
      } else d.append(el('span', {}, 'drag object here'));
      d.addEventListener('dragover', ev => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; d.classList.add('over'); });
      d.addEventListener('dragleave', () => d.classList.remove('over'));
      d.addEventListener('drop', ev => {
        ev.preventDefault(); ev.stopPropagation(); d.classList.remove('over');
        const pr = presetFromKey(ev.dataTransfer.getData('text/plain')); if (!pr) return;
        config.shortcuts[kind][code] = pr; saveConfig(); renderKbd(); renderBadges();

    m.append(g);
  }
}
function renderBadges() {
  document.querySelectorAll('#paletteBody .pi[data-key]').forEach(it => {
    it.querySelectorAll('.kb').forEach(x => x.remove());
    const pr = presetFromKey(it.dataset.key), keys = [];
    for (const [kind, lab] of [['ctrl', '^'], ['alt', '⌥']]) for (const code of SLOT_CODES) if (samePreset(config.shortcuts[kind][code], pr)) keys.push(lab + codeLabel(code));
    if (keys.length) it.append(el('span', { class: 'kb', title: keys.join(', ') }, keys[0] + (keys.length > 1 ? '+' : '')));
  });
}

/* ================= app close / unload ================= */
let closing = false;
window.__sumlRequestClose = async () => {
  try { window.sumlCloseAck && window.sumlCloseAck(); } catch (_) {}
  if (closing) return; closing = true;
  try {
    let saved = false;
    for (const t of tabs.slice()) {
      if (!t.dirty) continue;
      activate(t.id);
      const r = await askSave(t, true);
      if (!r) { closing = false; return; }
      if (r === 'saved') saved = true;
      if (r === 'discard') { tabs = tabs.filter(x => x !== t); if (!tabs.length) tabs.push(newTabObj()); activeTab = null; activate(tabs[0].id); }
    }
    persistTabs(); await flushConfig();
    setTimeout(() => { try { window.sumlQuit(); } catch (_) {} }, saved ? 1500 : 0);
  } finally { if (!HAS_HOST) closing = false; }
};
window.addEventListener('beforeunload', ev => {
  persistTabs();
  if (!HAS_HOST && tabs.some(t => t.dirty)) { ev.preventDefault(); ev.returnValue = ''; }
});

/* ================= boot ================= */
(async function boot() {
  await loadConfig();
  applyUi();
  buildPalette(); renderBadges();
  let st = null;
  try { st = JSON.parse(localStorage.getItem(TABS_KEY) || 'null'); } catch (_) {}
  if (st && Array.isArray(st.tabs) && st.tabs.length) {
    tabs = st.tabs.map(x => ({ id: x.id || rid('t'), doc: normalize(x.doc || {}), undo: [], redo: [], view: null, dirty: !!x.dirty, fname: typeof x.fname === 'string' ? x.fname : undefined }));
  } else {
    let legacy = null; try { legacy = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (_) {}
    tabs = [newTabObj(legacy && Array.isArray(legacy.nodes) && legacy.nodes.length ? legacy : example('arch'))];
  }
  const first = (st && tabs.find(t => t.id === st.active)) || tabs[0];
  activeTab = null; activate(first.id, true);
  requestAnimationFrame(fitView);
  updateStatus();
  const dirty = tabs.filter(t => t.dirty);
  if (dirty.length && !HAS_HOST) {
    activate(dirty[0].id, true);
    toast(`${dirty.length} diagram${dirty.length > 1 ? 's have' : ' has'} changes not exported yet (marked with a dot)`);
  }
})();
})();
